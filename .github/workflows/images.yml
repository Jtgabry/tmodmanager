# Test e immagini Docker di tModManager.
#
# A ogni push su main (e sui tag v*): test di agent, backend e frontend, poi costruzione delle due
# immagini e pubblicazione su GitHub Container Registry:
#   ghcr.io/<proprietario>/tmodmanager-web     ghcr.io/<proprietario>/tmodmanager-agent
# con i tag  latest (main) · sha-<commit> · <versione> (tag v1.2.3).
# Sulle pull request solo i test.
#
# Un'immagine viene ricostruita solo se cambiano i file da cui è fatta: ognuna ha anche il tag
# src-<hash dei sorgenti>, e se quel tag esiste già i tag nuovi vengono aggiunti alla stessa immagine
# (stesso digest). Così "tmm update" non ricrea l'agent, e non riavvia i server di gioco, quando cambia
# solo il sito. Per ricostruire comunque (es. aggiornamenti dell'immagine di base): avvio manuale con
# "rebuild".
name: Test e immagini

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild:
        description: Ricostruisci le immagini anche se i sorgenti non sono cambiati
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            frontend/package-lock.json

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip
          coverage: none

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Add-on (plugin TShock e mod tModLoader)
        run: bash addons/build.sh

      - name: Agent
        working-directory: agent
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm test

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          vendor/bin/pint --test
          php artisan test

  images:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [web, agent]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # File che finiscono nell'immagine (vedi i COPY in docker/<immagine>.Dockerfile)
      - id: src
        env:
          IMAGE: ${{ matrix.image }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          case "$IMAGE" in
            agent) paths='agent/package.json agent/package-lock.json agent/tsconfig.json agent/src addons
                          docker/agent.Dockerfile docker/agent-entrypoint.sh .dockerignore' ;;
            web)   paths='frontend backend docker/web.Dockerfile docker/php.ini docker/Caddyfile
                          docker/web-entrypoint.sh .dockerignore' ;;
          esac
          hash=$(git ls-files -s -- $paths | sha256sum | cut -c1-16)
          ref="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tmodmanager-$IMAGE:src-$hash"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if [ "$REBUILD" != true ] && docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
            echo "Sorgenti invariati: riuso $ref"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action converte il nome in minuscolo (obbligatorio per ghcr.io)
          images: ghcr.io/${{ github.repository_owner }}/tmodmanager-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - if: steps.src.outputs.exists == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ steps.src.outputs.ref }}
        run: |
          args=()
          while IFS= read -r t; do [ -n "$t" ] && args+=(-t "$t"); done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "$REF"

      - if: steps.src.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.src.outputs.ref }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Si tengono solo le ultime versioni: lo spazio dei pacchetti privati su GitHub è limitato
      - uses: actions/delete-package-versions@v5
        with:
          package-name: tmodmanager-${{ matrix.image }}
          package-type: container
          min-versions-to-keep: 3
